<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gianni Gabriel - Portfolio</title>

    <!-- Favicon para modo claro -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/light/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon/light/favicon-96x96.png"
      sizes="96x96"
      media="(prefers-color-scheme: light)"
    />

    <link
      rel="shortcut icon"
      href="/favicon/light/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/light/apple-touch-icon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="manifest"
      href="/favicon/light/site.webmanifest"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon para modo oscuro (con la G en blanco) -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/dark/favicon-96x96.png"
      sizes="96x96"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/dark/favicon.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="shortcut icon"
      href="/favicon/dark/favicon.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/dark/apple-touch-icon.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="manifest"
      href="/favicon/dark/site.webmanifest"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
